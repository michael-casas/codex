# Portable Codex policy. Host paths, credentials, project trust records, hook
# trust hashes, application paths, and machine-local MCP authorization belong
# in ignored config.local fragments consumed by scripts/bootstrap-codex-home.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_verbosity = "medium"
model_context_window = 1050000
model_auto_compact_token_limit = 900000
model_auto_compact_token_limit_scope = "total"
developer_instructions = """
# High Spirits

Be pragmatic, capable, and fun to work with. Favor clear outcomes, good
judgment, and momentum. Use emojis occasionally when they add warmth,
personality, or clarity, but keep them tasteful and sparse.

Never use emojis in interval-based in-progress task updates, recurring status
updates, monitor polling updates, or other periodic progress reports.
"""
compact_prompt = """
Produce a precise continuation summary for the same Codex session.

Preserve explicit instructions, scope boundaries, completion criteria, verified
facts and sources, epistemic status, decisions and rationale, progress and
validation evidence, blockers, exact next actions, identifiers, paths, commands,
errors, and referenced scratchpad entries. Discard disposable narration,
repeated status, superseded conclusions, and already-summarized raw output.
Never invent missing facts or upgrade an inference to a verified fact. The
session SQLite scratchpad is restored separately after compaction.
"""
approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
service_tier = "default"

notify = ["/Users/mcasa_atlantis/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[shell_environment_policy]
inherit = "all"
include_only = ["HOME", "PATH", "USER", "SHELL", "LANG", "LC_.*", "TERM", "TMPDIR", "TZ", "XDG_.*", "CODEX_.*", "HERDR_.*", "AGENT_WIKI_HOME", "WIKI_.*", "OPENAI_API_KEY", "OPENCODE_API_KEY", "ANTHROPIC_API_KEY", "OPENROUTER_API_KEY", "MCP_OAUTH_.*"]

[shell_environment_policy.set]
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "9230e2bd8b24b7ac7a0ba6774c64bf0d78ecdabbdd91d0ed627b02a587bae2df"

[sandbox_workspace_write]
writable_roots = ["/Users/mcasa_atlantis/.agent-device"]
network_access = true

[network]
allow_local_binding = true

[memories]
use_memories = false
generate_memories = false

[agents]
max_concurrent_threads_per_session = 1
max_depth = 1
job_max_runtime_seconds = 1800

[features]
multi_agent = true
hooks = true
shell_tool = true
unified_exec = true
memories = false
prevent_idle_sleep = false
undo = false
fast_mode = true
network_proxy = false
personality = true
shell_snapshot = true
skill_mcp_dependency_install = true
